name: openlit
version: 0.1.0
description: "Exports Hermes Agent turns, LLM calls and tool calls to OpenLIT as OTLP GenAI spans."
author: OpenLIT
license: Apache-2.0
homepage: https://docs.openlit.io/latest/openlit/observability/agents/hermes
python_dependencies:
  - "openlit>=1.45.0,<2"
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - post_auxiliary_call
  - post_tool_call
  - subagent_start
  - subagent_stop
  - on_session_end
