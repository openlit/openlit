# Optional sidecar: run your own OpenTelemetry Collector and forward OTLP to OpenLIT.
# OpenLIT no longer bundles otelcol. The image listens on :4317 (gRPC) and :4318 (HTTP).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlphttp/openlit:
    endpoint: ${env:OPENLIT_OTLP_ENDPOINT}
    headers:
      x-openlit-api-key: ${env:OPENLIT_API_KEY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp/openlit]
    metrics:
      receivers: [otlp]
      exporters: [otlphttp/openlit]
    logs:
      receivers: [otlp]
      exporters: [otlphttp/openlit]
