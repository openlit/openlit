name: CI / Automation

on:
  pull_request:
    paths:
      - '.github/release-tools.json'
      - '.github/scripts/**'
      - '.github/actions/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/release-tools.json'
      - '.github/scripts/**'
      - '.github/actions/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  release-engine:
    name: Test / Release engine
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run release engine tests
        run: python3 .github/scripts/test_release.py -v

  workflows:
    name: Lint / Workflows
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
