name: Validate Go SDK Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify final tag and SDK version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          VERSION=${RELEASE_TAG#go-}
          test "$(sed -n 's/^const Version = "\([^"]*\)"$/\1/p' sdk/go/version.go)" = "$VERSION"

      - uses: actions/setup-go@v6
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.sum

      - working-directory: sdk/go
        run: go test -v ./...

      - working-directory: sdk/go
        run: go build -v ./...
