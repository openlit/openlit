name: CI / TypeScript SDK

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to validate
        required: false
        default: ''
        type: string
  push:
    branches: [ "main" ]
    paths:
      - 'sdk/typescript/**'
      - 'assets/pricing.json'
      - '.github/workflows/ci-typescript.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'sdk/typescript/**'
      - 'assets/pricing.json'
      - '.github/workflows/ci-typescript.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    defaults:
      run:
        working-directory: sdk/typescript

    steps:
    - name: Checkout base code
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref || github.sha }}

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build TypeScript
      run: npm run build

    - name: Jest
      run: npm test

  runtimes:
    name: Test / Runtimes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript

    steps:
    - name: Checkout base code
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref || github.sha }}

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "22"

    - name: Set up Deno
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: v2.9.6

    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4

    - name: Install dependencies
      run: npm ci

    - name: Build TypeScript
      run: npm run build

    - name: Runtime matrix
      run: npm run test:runtimes
