name: Release / Packages

on:
  workflow_dispatch:
    inputs:
      tool:
        description: Package or tool to release
        required: true
        type: choice
        options:
          - Python SDK
          - TypeScript SDK
          - Go SDK
          - CLI
          - Controller
          - OTel GPU Collector
          - OpenLIT
      version:
        description: Stable SemVer without a prefix, for example 1.45.0
        required: true
        type: string
      dry_run:
        description: Generate notes and a version diff without changing refs or publishing
        required: true
        default: true
        type: boolean

concurrency:
  group: openlit-release
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  authorize:
    name: Authorize
    runs-on: ubuntu-24.04
    steps:
      - name: Require repository administrator
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$WORKFLOW_REF" != refs/heads/main ]; then
            echo "::error::Release packages must be run from main"
            exit 1
          fi
          PERMISSION=$(gh api "repos/$REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          if [ "$PERMISSION" != admin ]; then
            echo "::error::Release packages may only be run by repository administrators"
            exit 1
          fi

  prepare:
    name: Prepare
    needs: authorize
    runs-on: ubuntu-24.04
    environment: release
    outputs:
      tool: ${{ steps.prepare.outputs.tool }}
      publisher: ${{ steps.prepare.outputs.publisher }}
      version: ${{ steps.prepare.outputs.version }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      version_strategy: ${{ steps.prepare.outputs.version_strategy }}
      release_title: ${{ steps.prepare.outputs.release_title }}
      tag: ${{ steps.prepare.outputs.tag }}
      dry_run: ${{ steps.context.outputs.dry_run }}
    steps:
      - name: Resolve release context
        id: context
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "source_sha=main"
            echo "dry_run=$INPUT_DRY_RUN"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/heads/main

      - name: Fetch current main and tags
        run: git fetch --force origin main:refs/remotes/origin/main '+refs/tags/*:refs/tags/*'

      - name: Prepare scoped release notes
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_LLM_PRIMARY_MODEL: ${{ vars.RELEASE_LLM_PRIMARY_MODEL }}
          RELEASE_LLM_FALLBACK_MODEL: ${{ vars.RELEASE_LLM_FALLBACK_MODEL }}
          RELEASE_TOOL: ${{ inputs.tool }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.context.outputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 .github/scripts/release.py prepare \
            --tool "$RELEASE_TOOL" \
            --version "$RELEASE_VERSION" \
            --source-sha "$SOURCE_SHA" \
            --repository "$REPOSITORY" \
            --output-dir release-output

      - uses: actions/upload-artifact@v7
        with:
          name: release-preparation
          path: release-output/
          if-no-files-found: error

  validate-source:
    name: Validate / Source
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: Validate current main
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source SHA must be a full commit SHA"
            exit 1
          fi
          REMOTE_MAIN=$(git ls-remote --refs "https://github.com/$REPOSITORY.git" refs/heads/main | awk '{print $1}')
          if [ -z "$REMOTE_MAIN" ] || [ "$REMOTE_MAIN" != "$SOURCE_SHA" ]; then
            echo "::error::main advanced after release preparation; rerun the workflow"
            exit 1
          fi

  validate-python:
    name: Validate / Python SDK
    if: needs.prepare.outputs.tool == 'python'
    needs: [prepare, validate-source]
    uses: ./.github/workflows/ci-python.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  validate-typescript:
    name: Validate / TypeScript SDK
    if: needs.prepare.outputs.tool == 'typescript'
    needs: [prepare, validate-source]
    uses: ./.github/workflows/ci-typescript.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  validate-go:
    name: Validate / Go SDK
    if: needs.prepare.outputs.tool == 'go'
    needs: [prepare, validate-source]
    uses: ./.github/workflows/ci-go.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  validate-cli:
    name: Validate / CLI
    if: needs.prepare.outputs.tool == 'cli'
    needs: [prepare, validate-source]
    uses: ./.github/workflows/ci-cli.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  validate-controller:
    name: Validate / Controller
    if: needs.prepare.outputs.tool == 'controller'
    needs: [prepare, validate-source]
    uses: ./.github/workflows/ci-controller.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  validate-gpu-collector:
    name: Validate / GPU Collector
    if: needs.prepare.outputs.tool == 'gpu-collector'
    needs: [prepare, validate-source]
    uses: ./.github/workflows/ci-gpu-collector.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  validate-openlit:
    name: Validate / OpenLIT
    if: needs.prepare.outputs.tool == 'openlit'
    needs: [prepare, validate-source]
    uses: ./.github/workflows/ci-openlit.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  validate:
    name: Validate / Complete
    if: always()
    needs:
      - validate-source
      - validate-python
      - validate-typescript
      - validate-go
      - validate-cli
      - validate-controller
      - validate-gpu-collector
      - validate-openlit
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful selected validation
        env:
          RESULTS: >-
            ${{ toJSON(needs) }}
        run: |
          if ! jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS" >/dev/null; then
            echo "::error::release validation failed"
            jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
            exit 1
          fi

  bump:
    name: Version and tag
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.final.outputs.release_sha }}
    steps:
      - name: Create release App token
        if: needs.prepare.outputs.dry_run != 'true'
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout candidate source
        if: needs.prepare.outputs.dry_run != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout dry-run source
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}

      - uses: actions/download-artifact@v8
        with:
          name: release-preparation
          path: release-output

      - name: Apply and verify version strategy
        id: version
        run: python3 .github/scripts/release.py bump --metadata release-output/release-metadata.json

      - name: Save dry-run version diff
        if: needs.prepare.outputs.dry_run == 'true'
        run: git diff --binary > release-output/version-bump.diff

      - uses: actions/upload-artifact@v7
        if: needs.prepare.outputs.dry_run == 'true'
        with:
          name: release-dry-run
          path: release-output/
          if-no-files-found: error

      - name: Commit version and create final tag
        id: final
        env:
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VERSION_CHANGED: ${{ steps.version.outputs.changed }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            echo "release_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main:refs/remotes/origin/main
          if [ "$(git rev-parse 'origin/main^{commit}')" != "$SOURCE_SHA" ]; then
            echo "::error::main advanced during release preparation; rerun the workflow"
            exit 1
          fi

          if [ "$VERSION_CHANGED" = true ]; then
            git config user.name "openlit-release[bot]"
            git config user.email "openlit-release[bot]@users.noreply.github.com"
            mapfile -t version_files < <(jq -r '.version_files[]' release-output/release-metadata.json)
            git add -- "${version_files[@]}"
            git commit -m "chore(release): $RELEASE_TAG" -m "Release-Tag: $RELEASE_TAG"
            RELEASE_SHA=$(git rev-parse HEAD)
            git push origin "$RELEASE_SHA:refs/heads/main"
          else
            RELEASE_SHA=$SOURCE_SHA
          fi

          EXISTING_TAG_SHA=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" 2>/dev/null || true)
          if [ -n "$EXISTING_TAG_SHA" ]; then
            if [ "$EXISTING_TAG_SHA" != "$RELEASE_SHA" ]; then
              echo "::error::release tag already exists on a different commit"
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  publish-python:
    name: Publish / Python SDK
    if: needs.prepare.outputs.publisher == 'python' && needs.prepare.outputs.dry_run != 'true'
    needs: [prepare, bump]
    uses: ./.github/workflows/release-python.yml
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      release_sha: ${{ needs.bump.outputs.release_sha }}
    secrets: inherit

  publish-typescript:
    name: Publish / TypeScript SDK
    if: needs.prepare.outputs.publisher == 'typescript' && needs.prepare.outputs.dry_run != 'true'
    needs: [prepare, bump]
    uses: ./.github/workflows/release-typescript.yml
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      release_sha: ${{ needs.bump.outputs.release_sha }}
    secrets: inherit

  publish-go:
    name: Publish / Go SDK
    if: needs.prepare.outputs.publisher == 'go' && needs.prepare.outputs.dry_run != 'true'
    needs: [prepare, bump]
    uses: ./.github/workflows/release-go.yml
    permissions:
      contents: read
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      release_sha: ${{ needs.bump.outputs.release_sha }}

  publish-cli:
    name: Publish / CLI
    if: needs.prepare.outputs.publisher == 'cli' && needs.prepare.outputs.dry_run != 'true'
    needs: [prepare, bump]
    uses: ./.github/workflows/release-cli.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      release_sha: ${{ needs.bump.outputs.release_sha }}
    secrets: inherit

  publish-controller:
    name: Publish / Controller
    if: needs.prepare.outputs.publisher == 'controller' && needs.prepare.outputs.dry_run != 'true'
    needs: [prepare, bump]
    uses: ./.github/workflows/release-controller.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      release_sha: ${{ needs.bump.outputs.release_sha }}
    secrets: inherit

  publish-gpu-collector:
    name: Publish / GPU Collector
    if: needs.prepare.outputs.publisher == 'gpu-collector' && needs.prepare.outputs.dry_run != 'true'
    needs: [prepare, bump]
    uses: ./.github/workflows/release-gpu-collector.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      release_sha: ${{ needs.bump.outputs.release_sha }}
    secrets: inherit

  publish-openlit:
    name: Publish / OpenLIT
    if: needs.prepare.outputs.publisher == 'openlit' && needs.prepare.outputs.dry_run != 'true'
    needs: [prepare, bump]
    uses: ./.github/workflows/release-openlit.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      pull-requests: write
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      release_sha: ${{ needs.bump.outputs.release_sha }}
    secrets: inherit

  github-release:
    name: Publish / GitHub release
    if: always() && !cancelled() && !failure() && needs.prepare.outputs.dry_run != 'true'
    needs:
      - prepare
      - bump
      - publish-python
      - publish-typescript
      - publish-go
      - publish-cli
      - publish-controller
      - publish-gpu-collector
      - publish-openlit
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-preparation
          path: release-output

      - name: Download release assets
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_TITLE: ${{ needs.prepare.outputs.release_title }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --notes-file release-output/release-notes.md
          if [ -d release-assets ] && find release-assets -type f -print -quit | grep -q .; then
            gh release upload "$RELEASE_TAG" --repo "$REPOSITORY" release-assets/*
          fi

  homebrew:
    name: Publish / Homebrew
    if: needs.prepare.outputs.publisher == 'cli' && needs.prepare.outputs.dry_run != 'true'
    needs: [prepare, github-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Update Homebrew tap
        uses: dawidd6/action-homebrew-bump-formula@a0e064e08103c01870c6d1b05168d1b726aab119 # v8
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          tap: openlit/homebrew-openlit
          formula: openlit
          tag: ${{ needs.prepare.outputs.tag }}
