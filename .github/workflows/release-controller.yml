name: Release / Controller

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openlit/openlit-controller
  BINARY_NAME: openlit-controller

permissions:
  contents: read

jobs:
  verify:
    name: Verify / Tag
    runs-on: ubuntu-24.04
    steps:
      - name: Verify final tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          REMOTE_SHA=$(git ls-remote --refs "https://github.com/$REPOSITORY.git" "refs/tags/$RELEASE_TAG" | awk '{print $1}')
          test -n "$REMOTE_SHA"
          test "$REMOTE_SHA" = "$RELEASE_SHA"

  validate:
    name: Validate / Component CI
    needs: verify
    uses: ./.github/workflows/ci-controller.yml
    with:
      ref: ${{ inputs.release_sha }}

  # ── 2. Cross-compile binaries (linux only — eBPF requirement) ───────────
  build-binaries:
    name: Build / linux-${{ matrix.goarch }}
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: openlit-controller/go.mod
          cache-dependency-path: openlit-controller/go.sum

      - name: Set up eBPF toolchain
        uses: ./.github/actions/setup-ebpf

      - name: Generate eBPF objects
        working-directory: openlit-controller
        run: make setup-bpf generate

      - name: Extract version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: echo "version=${RELEASE_TAG#controller-}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        working-directory: openlit-controller
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          OUTPUT="${{ env.BINARY_NAME }}-${{ steps.version.outputs.version }}-linux-${{ matrix.goarch }}"
          go build -trimpath -ldflags "-s -w -X github.com/openlit/openlit/openlit-controller/internal/server.Version=${{ steps.version.outputs.version }}" \
            -o "../dist/${OUTPUT}" ./cmd/controller

      - name: Create tarball
        run: |
          cd dist
          for f in *; do
            tar czf "${f}.tar.gz" "$f"
            rm "$f"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-linux-${{ matrix.goarch }}
          path: dist/

  # ── 3. Collect binary assets for the orchestrator ─────────────────────────
  release:
    name: Package / Release assets
    needs: build-binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum -- ./* > SHA256SUMS.txt

      - name: Upload release assets to orchestrator
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-controller
          path: dist/*
          if-no-files-found: error

  # ── 4. Docker multi-arch image → GHCR ─────────────────────────────────────
  docker:
    name: Publish / Container
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log into GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: echo "version=${RELEASE_TAG#controller-}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./openlit-controller/
          file: ./openlit-controller/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          annotations: |
            ${{ steps.meta.outputs.annotations }},
            io.artifacthub.package.logo-url=https://github.com/openlit/.github/blob/main/profile/assets/favicon.png?raw=true,
            io.artifacthub.package.readme-url=https://github.com/openlit/openlit/blob/main/openlit-controller/README.md,
            io.artifacthub.package.license=Apache-2.0,
            org.opencontainers.image.vendor=OpenLIT,
            io.artifacthub.package.maintainers=[{'name':'OpenLIT','email':'developers@openlit.io'}],
            io.artifacthub.package.keywords='Monitoring, Observability, LLM, GenAI, OpenTelemetry, eBPF, Instrumentation'

      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          while IFS= read -r tag; do
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "$TAGS"
