name: Release / TypeScript SDK

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Final tag to publish
        required: true
        type: string
      release_sha:
        description: Immutable commit SHA referenced by the tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate / Component CI
    uses: ./.github/workflows/ci-typescript.yml
    with:
      ref: ${{ inputs.release_sha }}

  publish:
    name: Publish / npm
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}

      - name: Verify final tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          VERSION=${RELEASE_TAG#ts-}
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./package-lock.json').version")" = "$VERSION"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "$VERSION"

      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: npm
          registry-url: https://registry.npmjs.org
          cache-dependency-path: sdk/typescript/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Publish package
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
