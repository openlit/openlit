name: openlit CLI Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (cli-X.Y.Z)'
        required: true
        type: string
      release_sha:
        description: 'Immutable commit SHA referenced by the tag'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64,  ext: ""    }
          - { os: linux,   arch: arm64,  ext: ""    }
          - { os: darwin,  arch: amd64,  ext: ""    }
          - { os: darwin,  arch: arm64,  ext: ""    }
          - { os: windows, arch: amd64,  ext: ".exe" }
          - { os: windows, arch: arm64,  ext: ".exe" }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.mod
          check-latest: true
      - name: Resolve version
        id: ver
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          VERSION=${RELEASE_TAG#cli-}
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9._-]+)?$'; then
            echo "::error::Could not resolve a semver release version (got '${VERSION}'). Pass a 'tag' input like 'cli-1.2.0' on workflow_dispatch, or push a 'cli-X.Y.Z' tag."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
      - name: Build
        working-directory: ./cli
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          VERSION="${{ steps.ver.outputs.VERSION }}"
          COMMIT="$(git rev-parse --short HEAD)"
          # The version vars live in cli/internal/version, not in
          # `main`. The earlier `-X main.Version=...` flag silently
          # had no effect — every release binary printed `dev` from
          # the package default. -X must target the fully-qualified
          # package path or Go's linker quietly ignores it.
          PKG="github.com/openlit/openlit/cli/internal/version"
          go build -trimpath -ldflags "-s -w -X ${PKG}.Version=$VERSION -X ${PKG}.Commit=$COMMIT" \
            -o dist/openlit-${GOOS}-${GOARCH}${{ matrix.ext }} ./cmd/openlit
      - name: Package
        working-directory: ./cli
        run: |
          NAME="openlit-${{ matrix.os }}-${{ matrix.arch }}"
          BIN="dist/${NAME}${{ matrix.ext }}"
          cd dist
          # Ship the binary only. Earlier tar/zip steps also tried to
          # bundle ../README.md, but cli/ has no README — GNU tar exits
          # 2 on a missing member (linux/darwin builds), while zip on
          # Windows only warns. Homebrew and install.sh extract the
          # binary alone, so LICENSE/README in the archive are optional.
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip "${NAME}.zip" "$(basename "$BIN")"
            sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"
          else
            tar -czf "${NAME}.tar.gz" "$(basename "$BIN")"
            sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: openlit-${{ matrix.os }}-${{ matrix.arch }}
          path: cli/dist/*

  release:
    name: Prepare GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: openlit-*
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release/ \;
          ls -la release
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-cli
          path: release/*
          if-no-files-found: error

  docker:
    name: Container image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
      # The three Docker actions below are pinned to commit SHAs (instead
      # of `@v3` / `@v5`) so a future repoint of the tag can't slip a
      # backdoored buildx or login step into the GHCR push pipeline. The
      # SHAs are kept fresh by Dependabot via .github/dependabot.yml.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version
        id: ver
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION=${RELEASE_TAG#cli-}
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9._-]+)?$'; then
            echo "::error::Could not resolve a semver release version (got '${VERSION}')."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
      - name: Build and push image
        # docker/build-push-action is the action that actually produces
        # and pushes the multi-arch container image. Pinned to a SHA so
        # a compromised tag can't ship a backdoored image to GHCR.
        # NOTE: v5 is the last release of the v5 series (v5.4.0); v7 is
        # current upstream. Stay on v5 here until we test the v7 input
        # changes — the bump is tracked in Dependabot.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: cli/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.ver.outputs.VERSION }}
            COMMIT=${{ inputs.release_sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/openlit-cli:${{ steps.ver.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/openlit-cli:latest
